name: Update GitHub Stats
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=dark
          path: profile/langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Check generated files
        run: |
          echo "Generated files:"
          ls -lah profile/

          test -f profile/stats.svg
          test -f profile/langs.svg

          if grep -R "Something went wrong\\|Resource not accessible" profile/*.svg; then
            echo "Generated SVG contains an error card. Check GH_STATS_TOKEN permissions."
            exit 1
          fi

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/langs.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update stats cards"
          git push
